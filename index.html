<style>
/* Layout: full-bleed 3D kitchen scene; counters float top (CUTS) and above the control sheet (CUBES); controls dock at the bottom. */
:root{
  --bg:#14110d;
  --ink:#f6f0e4;
  --muted:#a99f8e;
  --gold:#e6b44c;
  --gold-ink:#241a06;
  --panel:rgba(22,18,13,.80);
  --line:rgba(255,240,210,.14);
  --chip:rgba(255,245,225,.06);
  --font-display:'Bricolage Grotesque','Arial Black',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;left:0;right:0;text-align:center;pointer-events:none;font-family:var(--font-display);text-shadow:0 2px 24px rgba(0,0,0,.55)}
.hud.top{top:clamp(10px,3vh,34px)}
.hud.bottom{bottom:calc(var(--sheet,230px) + 10px)}
.num{font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink)}
.hud.top .num{font-size:clamp(56px,15vw,104px)}
.hud.bottom .num{font-size:clamp(30px,8vw,46px)}
.lab{font-weight:700;letter-spacing:.06em;color:var(--gold);font-size:clamp(14px,3.6vw,20px);margin-top:4px}
.bump{animation:bump .18s ease-out}
@keyframes bump{50%{transform:scale(1.06)}}

#sheet{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:12px;
  padding:14px max(16px,env(safe-area-inset-left,0px)) 14px max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,rgba(20,17,13,0) 0,var(--panel) 22%);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
#sheet>*{min-width:0}
#chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:500 14px var(--font-body);cursor:pointer}
.chip .e{font-size:22px;line-height:1}
.chip[aria-checked="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:600}
.row{display:flex;align-items:center;gap:12px}
.cap{flex:0 0 auto;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#cutsIn{flex:0 0 96px;width:96px;box-sizing:border-box;padding:9px 10px;border-radius:12px;border:1px solid var(--gold);background:var(--chip);color:var(--ink);font:800 20px var(--font-display);font-variant-numeric:tabular-nums;text-align:center}
#cutsIn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#sizes{flex:1;min-width:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:3px;border-radius:12px;background:var(--chip);border:1px solid var(--line)}
.sz{padding:7px 0;border:0;border-radius:9px;background:transparent;color:var(--muted);font:600 13px var(--font-body);cursor:pointer;font-variant-numeric:tabular-nums}
.sz[aria-checked="true"]{background:var(--ink);color:#1b150c}
.plan{display:flex;flex-direction:column;gap:2px;font-size:14px}
.plan b{font-family:var(--font-display);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.plan .sub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.actions{display:flex;gap:10px}
button{font-family:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.primary{flex:1;border:0;border-radius:14px;padding:14px 16px;background:var(--gold);color:var(--gold-ink);font:800 16px var(--font-display);letter-spacing:.01em;cursor:pointer}
.primary:active{transform:translateY(1px)}
.ghost{flex:0 0 auto;min-width:64px;border-radius:14px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:700 15px var(--font-display);cursor:pointer}
#sheet{transition:transform .35s ease,opacity .3s ease}
#app.running #sheet{transform:translateY(105%);opacity:0;pointer-events:none}
#stop{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:12px 24px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;pointer-events:none;transform:translateX(-50%) translateY(24px);transition:transform .35s ease,opacity .3s ease}
#app.running #stop{opacity:1;pointer-events:auto;transform:translateX(-50%)}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--ink);background:var(--bg)}
#rec{flex:0 0 auto;min-width:64px;border-radius:14px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:700 15px var(--font-display);cursor:pointer}
#rec[aria-pressed="true"]{background:#d6301c;border-color:#d6301c;color:#fff}
#recDot{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;display:none;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--panel);font:700 12px var(--font-body);color:#fff;pointer-events:none}
#recDot::before{content:'';width:9px;height:9px;border-radius:50%;background:#ff3b30;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
#app.recording #recDot{display:flex}
#result{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;background:rgba(10,8,5,.92);z-index:10}
#result.show{display:flex}
#result video{max-width:100%;max-height:68%;border-radius:14px;background:#000}
#result .actions{width:100%;max-width:420px}
#result a.primary{text-decoration:none;text-align:center}
#result .hint{font-size:12px;color:var(--muted);text-align:center}
@media (max-width:420px){.cap{font-size:10px;max-width:56px}}
@media (prefers-reduced-motion:reduce){.bump{animation:none}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
if(typeof THREE==='undefined'){document.getElementById('err').style.display='flex';return;}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const TAU=Math.PI*2;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const sstep=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x);};
const lerp=(a,b,t)=>a+(b-a)*t;
const hex=h=>[(h>>16&255)/255,(h>>8&255)/255,(h&255)/255];
const M=(a,b,t)=>{const A=hex(a),B=hex(b);t=clamp(t,0,1);return [A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t];};
const hash3=(x,y,z)=>{const h=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453;return h-Math.floor(h);};
const rad=(v,w)=>Math.hypot(v,w);
const fmt=n=>Math.round(n).toLocaleString('en-US');
const approx=n=>{n=Math.round(n);if(n<100000)return fmt(n);const d=Math.pow(10,String(n).length-3);return '≈ '+fmt(Math.round(n/d)*d);};

/* ---------- items ----------
   dim = real size in cm [length(x), height(y), width(z)].
   f(u,v,w) in normalized box coords [-1,1]: <=1 inside, 0 center, 1 surface. */
const ITEMS=[
 {id:'avocado',name:'Avokado',emo:'🥑',dim:[12,7,7],c:[-.15,0,0],
  f(u,v,w){const p=(u+1)/2;const r=p<.4?Math.sqrt(1-((.4-p)/.4)**2):Math.pow(Math.max(0,1-Math.pow((p-.4)/.6,1.7)),.6)*.98;return r<.02?9:rad(v,w)/r;},
  skin(u,v,w,h){return M(0x335720,0x1a2f0f,h);},
  flesh(f,u,v,w,h){if(Math.hypot((u+.3)*6,v*3.5,w*3.5)<1.9)return M(0x6a3b1f,0x8c5732,h);if(f>.88)return M(0x86ad3d,0x5b8527,(f-.88)/.12);return M(0xf0e787,0xa3c04a,Math.pow(f,1.4));}},
 {id:'apple',name:'Olma',emo:'🍎',dim:[8,7.5,8],c:[0,0,0],
  f(u,v,w){const r=rad(u,w);return Math.hypot(u,v*(v>0?1:.95),w)+(v>0?.5*Math.max(0,.3-r):0);},
  skin(u,v,w,h){return M(0xb81f28,0xe4583a,clamp(.5+.5*Math.sin(Math.atan2(w,u)*9+v*3)+h*.35,0,1));},
  flesh(f,u,v,w,h){if(f<.3&&h>.9)return hex(0x4a2a14);if(f<.3)return hex(0xdcc78a);return M(0xf7efd6,0xe9dcb4,f);}},
 {id:'tomato',name:'Pomidor',emo:'🍅',dim:[7.5,6.5,7.5],c:[0,0,0],
  f(u,v,w){const r=rad(u,w);return Math.hypot(u,v,w)+(v>0?.35*Math.max(0,.24-r):0);},
  skin(u,v,w,h){return M(0xd6301c,0xb92312,h);},
  flesh(f,u,v,w,h){if(f<.45&&h>.8)return hex(0xf6d77a);return M(0xf08a62,0xdd3f27,sstep(.2,.9,f)*.9+h*.1);}},
 {id:'carrot',name:'Sabzi',emo:'🥕',dim:[18,3.4,3.4],c:[-.3,0,0],
  f(u,v,w){const p=(u+1)/2;const r=1-.9*Math.pow(p,.95);return r<.1?9:rad(v,w)/r;},
  skin(u,v,w,h){return M(0xea7a1c,0xcb5f10,h);},
  flesh(f,u,v,w,h){return f<.35?M(0xe0650f,0xee7d1a,h):M(0xf4922a,0xf7a948,f);}},
 {id:'cucumber',name:'Bodring',emo:'🥒',dim:[20,4.2,4.2],c:[0,0,0],
  f(u,v,w){const a=Math.abs(u);const r=Math.sqrt(1-Math.pow(a,8));return r<.02?9:rad(v,w)/r;},
  skin(u,v,w,h){return M(0x2f6b2a,0x1d4a1c,clamp(.5+.5*Math.sin(Math.atan2(w,v)*7)+h*.3,0,1));},
  flesh(f,u,v,w,h){if(f<.35)return M(0xeef3c8,0xdde8a6,h);if(f>.82)return M(0x8fbf62,0x5f9a45,(f-.82)/.18);return M(0xd6ebaa,0xb4d67e,f);}},
 {id:'potato',name:'Kartoshka',emo:'🥔',dim:[10,6,7],c:[0,0,0],
  f(u,v,w){return Math.hypot(u,v,w)*(1+.1*Math.sin(3.1*u+1.3)*Math.cos(2.6*v+.5)+.08*Math.sin(3.3*w+2)*Math.sin(2*u));},
  skin(u,v,w,h){return M(0xbf9355,0x9a6e3a,clamp(h+.3*Math.sin(u*14+w*11),0,1));},
  flesh(f,u,v,w,h){return M(0xf6e9b4,0xe6d08a,f*.8+h*.2);}},
 {id:'eggplant',name:'Baqlajon',emo:'🍆',dim:[22,8,8],c:[0,0,0],
  f(u,v,w){const p=(u+1)/2;const r=p<.6?.38+.62*Math.pow(Math.sin(Math.PI/2*p/.6),1.3):Math.sqrt(Math.max(0,1-((p-.6)/.4)**2));return r<.03?9:rad(v,w)/r;},
  skin(u,v,w,h){return M(0x44206a,0x2a1043,h);},
  flesh(f,u,v,w,h){if(f<.3&&h>.5)return hex(0xb7a56c);return M(0xf1ecc6,0xdcd39a,f);}},
 {id:'onion',name:'Piyoz',emo:'🧅',dim:[8,8,8],c:[0,0,0],
  f(u,v,w){const s=v>0?1-.45*v:1;return Math.sqrt((rad(u,w)/s)**2+v*v);},
  skin(u,v,w,h){return M(0x93407f,0x6e2a5f,h);},
  flesh(f,u,v,w,h){return M(0xf8f1f3,0xd9a3cd,sstep(.35,.65,Math.sin(f*24)*.5+.5));}},
 {id:'orange',name:'Apelsin',emo:'🍊',dim:[8,8,8],c:[0,0,0],
  f(u,v,w){return Math.hypot(u,v,w);},
  skin(u,v,w,h){return M(0xf3931a,0xdc7508,h);},
  flesh(f,u,v,w,h){if(f>.9)return M(0xf49a1c,0xe27c0c,h);if(f>.84)return hex(0xfbf3dc);const seg=Math.abs(Math.sin(Math.atan2(w,v)*5))<.1&&f>.18;return seg?hex(0xfae0a0):M(0xfdab2c,0xf28d12,h*.8+f*.2);}},
 {id:'lemon',name:'Limon',emo:'🍋',dim:[7.5,5.2,5.2],c:[0,0,0],
  f(u,v,w){const a=Math.abs(u);const r=Math.sqrt(Math.max(0,1-Math.pow(a,2.4)));return r<.03?9:rad(v,w)/r;},
  skin(u,v,w,h){return M(0xf5d820,0xe3bf0d,h);},
  flesh(f,u,v,w,h){if(f>.9)return hex(0xf2cf1a);if(f>.84)return hex(0xfdf8d8);const seg=Math.abs(Math.sin(Math.atan2(w,v)*4))<.1&&f>.15;return seg?hex(0xfaf0a0):M(0xfbeb6a,0xf4d83a,h);}},
 {id:'banana',name:'Banan',emo:'🍌',dim:[19,7,4],c:[0,-.457,0],
  f(u,v,w){const a=Math.abs(u);if(a>=1)return 9;const cy=(-1.6+3.2*u*u)/3.5;const r=1.75*Math.pow(1-Math.pow(a,5),.45);return r<.05?9:Math.hypot((v-cy)*3.5,w*2)/r;},
  skin(u,v,w,h){return M(0xf3d23c,0xdcb722,h);},
  flesh(f,u,v,w,h){return f<.2?M(0xe2d49a,0xd2c283,h):M(0xf8f0cd,0xefe3b0,f);}},
 {id:'watermelon',name:'Tarvuz',emo:'🍉',dim:[30,21,21],c:[0,0,0],
  f(u,v,w){return Math.hypot(u,v,w);},
  skin(u,v,w,h){const s=Math.sin(Math.atan2(w,v)*9+u*2.5)*.5+.5;return M(0x2f6e33,0x174a20,s*.8+h*.2);},
  flesh(f,u,v,w,h){if(f>.92)return hex(0x2c6a31);if(f>.84)return hex(0xeaf2d6);if(h>.987&&f<.8)return hex(0x15100d);return M(0xf0435a,0xe22a47,f);}},
];

const PRESETS=[25,100,300,1000];
const GMAX=56;          // max voxels along the longest axis (what the screen shows)
const SCENE_LEN=3.7;    // scene units for the item's length
const GROOVE=.1;         // cut groove: each side of a cut trims this fraction of a cell (no growth)
const INTRO=1.0, GAPT=.6, SETTLE=3.0, OUTRO=1.1;

/* ---------- renderer / scene ---------- */
const canvas=$('#gl');
let renderer;
try{
  renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
}catch(e){document.getElementById('err').style.display='flex';return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x14110d);
const camera=new THREE.PerspectiveCamera(36,1,.1,100);

/* environment for metal reflections */
(function(){
  const es=new THREE.Scene();
  es.add(new THREE.Mesh(new THREE.BoxGeometry(30,30,30),new THREE.MeshBasicMaterial({color:0x3a322a,side:THREE.BackSide})));
  const pan=(w,h,x,y,z,k,rx,ry)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(k,k*.96,k*.88),side:THREE.DoubleSide}));m.position.set(x,y,z);m.rotation.set(rx||0,ry||0,0);es.add(m);};
  pan(14,6,0,13,0,7,Math.PI/2,0);
  pan(5,14,-12,3,3,5,0,Math.PI/2);
  pan(8,4,5,4,12,3,0,0);
  pan(6,8,12,5,-4,2.2,0,Math.PI/2);
  const pm=new THREE.PMREMGenerator(renderer);
  scene.environment=pm.fromScene(es,.04).texture;
  pm.dispose();
})();

scene.add(new THREE.HemisphereLight(0xfff0dc,0x1a140e,.5));
const key=new THREE.DirectionalLight(0xfff1da,2.3);
key.position.set(-3.5,7.5,4.5);
key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
const sc=key.shadow.camera;sc.left=-6;sc.right=6;sc.top=6;sc.bottom=-6;sc.near=1;sc.far=22;
key.shadow.bias=-.0004;key.shadow.normalBias=.025;
scene.add(key);
const rim=new THREE.DirectionalLight(0xbfd8ff,.55);rim.position.set(5,4,-5);scene.add(rim);

/* textures */
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t;}
const rnd=(()=>{let s=12345;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};})();
const woodTex=canvasTex(1024,512,(g,w,h)=>{
  const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#e2b074');gr.addColorStop(.5,'#d8a566');gr.addColorStop(1,'#cf9a5c');
  g.fillStyle=gr;g.fillRect(0,0,w,h);
  for(let i=0;i<340;i++){const y=rnd()*h,a=.04+rnd()*.16,len=200+rnd()*800,x0=rnd()*w;g.strokeStyle='rgba(112,64,22,'+a+')';g.lineWidth=.6+rnd()*1.8;g.beginPath();g.moveTo(x0,y);
    for(let x=0;x<=len;x+=40)g.lineTo(x0+x,y+Math.sin((x0+x)*.012+i)*3);g.stroke();}
  for(let i=0;i<5;i++){const x=rnd()*w,y=rnd()*h;g.fillStyle='rgba(120,70,25,.12)';g.beginPath();g.ellipse(x,y,26+rnd()*30,6+rnd()*6,0,0,TAU);g.fill();}
});
const tileTex=canvasTex(1024,512,(g,w,h)=>{
  g.fillStyle='#0f1a13';g.fillRect(0,0,w,h);
  const tw=128,th=64;

/* ---------- knife pose ---------- */
const qX=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),Math.PI);
const qZ=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),Math.PI/2);

  if(tt<S[0].t0){

    if(nxt&&tt<nxt.t0){

const poseOut={pos:new THREE.Vector3(),q:qX,U:0};

  if(cubes!==lastCubes){$('#cubes').textContent=cubes<=0?'0':approx(cubes);lastCubes=cubes;}

    }
    cur.uni.uCut.value[s.ax]=G.reduce((a,b)=>a+b,0);
    const frac=tt>=s.t0+s.D?1:(tt<s.t0?0:(s.ax==='y'?U/s.nb:clamp((U-.3)/s.nb,0,1)));

  const pv=new THREE.Vector3();poseAt(Math.max(0,tt-.02),gp);pv.copy(gp.pos);

  const blur=clamp((vel-9)/26,0,.34);
  ghosts.forEach((g,i)=>{
    if(blur<=.01){g.visible=false;return;}
    poseAt(Math.max(0,tt-.012*(i+1)),gp);
    g.visible=true;g.position.copy(gp.pos);g.quaternion.copy(gp.q);g.material.opacity=blur*(1-i*.3);
  });
}

function idleUpdate(){
  const bob=Math.sin(clockT*1.4)*.08;
  knife.position.set(parkPos.x,parkPos.y+bob,parkPos.z);knife.quaternion.copy(qPark);
  ghosts.forEach(g=>g.visible=false);
  objGroup.rotation.y=Math.sin(clockT*.5)*.4;
  cur.smooth.visible=true;cur.inst.visible=false;
}

/* ---------- UI ---------- */
function setGoLabel(){
  document.getElementById('app').classList.toggle('running',mode==='run');
  $('#go').textContent=mode==='run'?'To‘xtatib, boshidan':(mode==='done'?'Yana kesish':'Kesishni boshlash');
}
function updatePlan(){
  $('#planCuts').textContent=fmt(cur.totalCuts);
  $('#planCubes').textContent=approx(cur.cubes);
  const d=cur.it.dim,sz=cur.sizeCm;
  $('#planAxes').textContent=`Uzunligi bo‘yicha ${fmt(cur.real.x)} · eni ${fmt(cur.real.z)} · balandligi ${fmt(cur.real.y)} (${d[0]}×${d[2]}×${d[1]} sm, kubik ≈ ${+(sz*10).toFixed(sz*10<1?2:1)} mm)`;
}
const chips=$('#chips');
ITEMS.forEach((it,i)=>{
  const b=document.createElement('button');b.type='button';b.className='chip';b.setAttribute('role','radio');
  b.innerHTML='<span class="e">'+it.emo+'</span><span>'+it.name+'</span>';
  b.addEventListener('click',()=>{itemIdx=i;sync();load();});
  chips.appendChild(b);
});
const sizesEl=$('#sizes'),cutsIn=$('#cutsIn');
function setCuts(v){v=clamp(Math.round(+v)||1,1,5000);cutTarget=v;cutsIn.value=v;sync();load();}
PRESETS.forEach(p=>{const b=document.createElement('button');b.type='button';b.className='sz';b.textContent=p;b.addEventListener('click',()=>setCuts(p));sizesEl.appendChild(b);});
let cutTimer=0;
cutsIn.addEventListener('input',()=>{clearTimeout(cutTimer);cutTimer=setTimeout(()=>{if(cutsIn.value!=='')setCuts(cutsIn.value);},450);});
cutsIn.addEventListener('change',()=>setCuts(cutsIn.value));
function sync(){
  [...chips.children].forEach((b,i)=>b.setAttribute('aria-checked',i===itemIdx));
  [...sizesEl.children].forEach((b,i)=>b.setAttribute('aria-checked',PRESETS[i]===cutTarget));
  const act=chips.children[itemIdx];if(act)try{chips.scrollTo({left:act.offsetLeft-chips.clientWidth/2+act.clientWidth/2,behavior:'smooth'});}catch(e){}
}
$('#stop').addEventListener('click',()=>{stopRec(false);load();});
$('#go').addEventListener('click',()=>{
  if(mode!=='idle')load();
  mode='run';t=0;setGoLabel();
  if(recOn)startRec();
});
$('#spd').addEventListener('click',e=>{speed=speed===1?2:(speed===2?4:1);e.currentTarget.textContent=speed+'×';});

/* ---------- recording ---------- */
let recOn=false,rec=null,recChunks=[],recCanvas=null,recCtx=null,recStopAt=0,recUrl=null,recMime='';
const recBtn=$('#rec');
recBtn.addEventListener('click',()=>{
  if(typeof MediaRecorder==='undefined'||!HTMLCanvasElement.prototype.captureStream){recBtn.textContent='Yo‘q';return;}
  recOn=!recOn;recBtn.setAttribute('aria-pressed',recOn);recBtn.textContent=recOn?'⏺ Yoqilgan':'⏺ Yozish';
});
function pickMime(){
  const c=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  for(const m of c){try{if(MediaRecorder.isTypeSupported(m))return m;}catch(e){}}
  return '';
}
function startRec(){
  stopRec(false);
  const gl=$('#gl');
  const k=Math.min(1,1280/Math.max(gl.width,gl.height));
  recCanvas=document.createElement('canvas');
  recCanvas.width=Math.round(gl.width*k)&~1;recCanvas.height=Math.round(gl.height*k)&~1;
  recCtx=recCanvas.getContext('2d');
  try{
    recMime=pickMime();
    const st=recCanvas.captureStream(30);
    rec=new MediaRecorder(st,recMime?{mimeType:recMime,videoBitsPerSecond:6e6}:{videoBitsPerSecond:6e6});
  }catch(e){rec=null;return;}
  recChunks=[];recStopAt=0;
  rec.ondataavailable=e=>{if(e.data&&e.data.size)recChunks.push(e.data);};
  rec.start(250);
  $('#app').classList.add('recording');
}
function stopRec(save){
  const r=rec;rec=null;recStopAt=0;
  $('#app').classList.remove('recording');
  if(!r||r.state==='inactive')return;
  r.onstop=()=>{
    if(!save||!recChunks.length)return;
    const type=(recMime||r.mimeType||'video/webm').split(';')[0];
    const blob=new Blob(recChunks,{type});
    if(recUrl)URL.revokeObjectURL(recUrl);
    recUrl=URL.createObjectURL(blob);
    const v=$('#resVid');v.src=recUrl;v.play().catch(()=>{});
    const a=$('#resDl');a.href=recUrl;a.download='kubik-kesgich.'+(type.indexOf('mp4')>=0?'mp4':'webm');
    $('#result').classList.add('show');
  };
  try{r.stop();}catch(e){}
}
function drawRec(){
  if(!rec||!recCtx)return;
  const w=recCanvas.width,h=recCanvas.height;
  recCtx.drawImage($('#gl'),0,0,w,h);
  const u=w/390;
  recCtx.textAlign='center';recCtx.fillStyle='#f6f0e4';recCtx.shadowColor='rgba(0,0,0,.55)';recCtx.shadowBlur=12*u;
  recCtx.font='800 '+Math.round(Math.min(104,w*.15)*(w>600?1:1))+'px "Bricolage Grotesque",Arial Black,sans-serif';
  const big=Math.round(Math.min(w*.15,104*u));
  recCtx.font='800 '+big+'px "Bricolage Grotesque",Arial Black,sans-serif';
  recCtx.fillText($('#cuts').textContent,w/2,h*.04+big);
  recCtx.fillStyle='#e6b44c';recCtx.font='700 '+Math.round(big*.2)+'px "Bricolage Grotesque",Arial Black,sans-serif';
  recCtx.fillText('KESISH',w/2,h*.04+big+big*.28);
  const mid=Math.round(Math.min(w*.08,46*u));
  recCtx.fillStyle='#f6f0e4';recCtx.font='800 '+mid+'px "Bricolage Grotesque",Arial Black,sans-serif';
  recCtx.fillText($('#cubes').textContent,w/2,h*.9);
  recCtx.fillStyle='#e6b44c';recCtx.font='700 '+Math.round(mid*.45)+'px "Bricolage Grotesque",Arial Black,sans-serif';
  recCtx.fillText('KUBIK',w/2,h*.9+mid*.55);
  recCtx.shadowBlur=0;
}
$('#resClose').addEventListener('click',()=>{$('#result').classList.remove('show');const v=$('#resVid');v.pause();});

/* ---------- resize / camera ---------- */
function resize(){
  const w=Math.max(1,$('#app').clientWidth),h=Math.max(1,$('#app').clientHeight);
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  const vf=camera.fov*Math.PI/180,aspect=w/h;
  const dist=Math.max(10.2,6.4/(2*Math.tan(vf/2)*aspect));
  const dir=new THREE.Vector3(0,.5,.86).normalize();
  const target=new THREE.Vector3(0,.55,0);
  camera.position.copy(target).addScaledVector(dir,dist);
  camera.lookAt(target);
  const sheet=$('#sheet').offsetHeight;
  document.getElementById('app').style.setProperty('--sheet',sheet+'px');
  camera.setViewOffset(w,h,0,sheet*.42,w,h);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe($('#sheet'));

/* ---------- loop ---------- */
let last=performance.now(),finishedOnce=false;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;clockT+=dt;
  if(cur){
    if(mode==='run'){
      t+=dt*speed;
      if(t>=tl.end){t=tl.end;mode='done';setGoLabel();if(rec)recStopAt=performance.now()+1500;}
      update(t);
    }else if(mode==='done'){
      update(tl.end);
      const bob=Math.sin(clockT*1.4)*.08;knife.position.y=parkPos.y+bob;
    }else idleUpdate();
  }
  renderer.render(scene,camera);
  if(rec){drawRec();if(recStopAt&&now>=recStopAt)stopRec(true);}
}
sync();
resize();
load();
requestAnimationFrame(frame);
window.__app={load,update:tt=>{update(tt);},get tl(){return tl;},get cur(){return cur;},setItem:i=>{itemIdx=i;sync();load();},setSize:i=>{cutTarget=i;sync();load();},start:()=>{$('#go').click();},seek:tt=>{mode='run';t=tt;}};
})();
</script>

</body></html>
